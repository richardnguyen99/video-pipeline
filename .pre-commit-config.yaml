# Monorepo pre-commit configuration
# - Frontend: ESLint + Prettier + production build
# - Backend: Black + Pylint + Mypy + production build
# - Commit message: conventional commits for the whole monorepo
#
# Hook implementations live in scripts/pre-commit/

default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # ── Frontend ──────────────────────────────────────────
      - id: frontend-eslint
        name: frontend eslint
        language: system
        entry: bash scripts/pre-commit/frontend-eslint.sh
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: true

      - id: frontend-prettier
        name: frontend prettier
        language: system
        entry: bash scripts/pre-commit/frontend-prettier.sh
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|md|json)$
        pass_filenames: true

      - id: frontend-build
        name: frontend production build
        language: system
        entry: bash scripts/pre-commit/frontend-build.sh
        files: ^frontend/
        pass_filenames: false

      # ── Backend ───────────────────────────────────────────
      - id: backend-black
        name: backend black
        language: system
        entry: bash scripts/pre-commit/backend-black.sh
        files: ^backend/.*\.py$
        exclude: ^backend/alembic/
        pass_filenames: true

      - id: backend-pylint
        name: backend pylint
        language: system
        entry: bash scripts/pre-commit/backend-pylint.sh
        files: ^backend/.*\.py$
        exclude: ^backend/alembic/
        pass_filenames: true

      - id: backend-mypy
        name: backend mypy
        language: system
        entry: bash scripts/pre-commit/backend-mypy.sh
        files: ^backend/.*\.py$
        exclude: ^backend/alembic/
        pass_filenames: true

      - id: backend-build
        name: backend production build
        language: system
        entry: bash scripts/pre-commit/backend-build.sh
        files: ^backend/
        pass_filenames: false


      - id: backend-pytest
        name: backend unit tests
        language: system
        entry: bash scripts/pre-commit/backend-pytest.sh
        files: ^backend/
        pass_filenames: false

      # ── Commit message (all packages) ─────────────────────
      - id: commitlint
        name: commitlint
        language: system
        entry: bash scripts/pre-commit/commitlint.sh
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
