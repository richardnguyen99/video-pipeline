# Monorepo pre-commit configuration
# - Frontend: ESLint + Prettier + production build on staged frontend files
# - Backend: no lint/format/build hooks
# - Commit message: conventional commits for the whole monorepo
#
# Hook implementations live in scripts/pre-commit/

default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        language: system
        entry: bash scripts/pre-commit/frontend-eslint.sh
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: true

      - id: frontend-prettier
        name: frontend prettier
        language: system
        entry: bash scripts/pre-commit/frontend-prettier.sh
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|md|json)$
        pass_filenames: true

      - id: frontend-build
        name: frontend production build
        language: system
        entry: bash scripts/pre-commit/frontend-build.sh
        files: ^frontend/
        pass_filenames: false

      - id: commitlint
        name: commitlint
        language: system
        entry: bash scripts/pre-commit/commitlint.sh
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
