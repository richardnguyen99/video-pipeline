[tool.black]
line-length = 79
target-version = ["py314"]
include = '\.pyi?$'
# Note: exclude is ignored when paths are passed explicitly on the CLI;
# scripts/pre-commit/backend-black.sh also filters alembic/
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | __pycache__
  | \.mypy_cache
  | \.pytest_cache
  | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 79
skip_gitignore = true
extend_skip = [".venv", "venv", "__pycache__", "alembic"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["(^|/)\\.venv/", "(^|/)venv/", "(^|/)alembic/", "(^|/)__pycache__/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "celery.*", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
strict_markers = true
addopts = ["-q", "--tb=short"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["unit: pure unit tests with mocks/fixtures"]
