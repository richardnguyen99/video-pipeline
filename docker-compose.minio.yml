# Local MinIO object storage (S3-compatible), data on external drive.
#
# 1. Copy env template and set paths (do not commit real paths):
#      cp .env.minio.example .env.minio
#      # edit MINIO_DATA_DIR / HLS_SOURCE_DIR
#
# 2. Start MinIO (compose reads `.env` or pass `--env-file`):
#      docker compose --env-file .env.minio -f docker-compose.minio.yml up -d
#
# 3. Migrate existing HLS tree into the bucket (one-time / incremental):
#      ./scripts/migrate-hls-to-minio.sh
#
# Console:  http://localhost:9001  (minioadmin / minioadmin)
# S3 API:   http://localhost:9000
#
# MinIO data lives under MINIO_DATA_DIR on the external drive — not in a
# Docker named volume on the internal disk.

services:
  minio:
    image: minio/minio:latest
    container_name: video-pipeline-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      # Bind-mount only — no named volume on the PC disk.
      - ${MINIO_DATA_DIR}:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: video-pipeline-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Waiting for MinIO..."
        i=0
        until mc alias set local http://minio:9000 \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "MinIO did not become ready in time"
            exit 1
          fi
          sleep 1
        done
        mc mb --ignore-existing local/video-samples
        mc anonymous set download local/video-samples
        echo "Bucket video-samples is ready"
    restart: "no"
