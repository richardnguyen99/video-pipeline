# Isolated Redis for this project.
#
#   cp .env.redis.example .env.redis
#   docker compose --env-file .env.redis -f docker-compose.redis.yml up -d
#
# Authentication uses requirepass (REDIS_PASSWORD). Clients connect with:
#   redis://:${REDIS_PASSWORD}@localhost:${REDIS_PORT}/0
#
# Data defaults to a Docker named volume. For a host path, set REDIS_DATA_DIR
# (must support Unix permissions — prefer ext4/xfs, not exFAT/NTFS).

services:
  redis:
    image: redis:7-alpine
    container_name: video-pipeline-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - ${REDIS_DATA_DIR:-redis_data}:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: unless-stopped

volumes:
  redis_data:
